# postgresql.conf for Docker dev testing (TimescaleDB)

listen_addresses = '*'
port = 5432

# --- Logging to ./logs ---
logging_collector = on
log_destination = 'stderr'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = '1d'
log_rotation_size = 0
log_line_prefix = '%m [%p] %u@%d %r '
log_file_mode = 0644
log_connections = on
log_disconnections = on
log_checkpoints = on
log_min_error_statement = 'error'
log_temp_files = 0

# Useful for dev visibility
log_min_messages = info
# log_min_duration_statement = 250
# log_statement = 'none'

# --- Preloaded libraries ---
# REQUIRED: timescaledb must be preloaded (and listed first) before
# `CREATE EXTENSION timescaledb` is run by flyway.
shared_preload_libraries = 'timescaledb,pg_stat_statements'
pg_stat_statements.track = all

# --- TimescaleDB ---
timescaledb.telemetry_level = off            # no phone-home from dev containers
timescaledb.max_background_workers = 8       # policy jobs: compression, retention, cagg refresh
# timescaledb.enable_chunk_skipping = on     # enable_chunk_skipping() on non-time columns

# Background workers: must be >= timescaledb.max_background_workers
#   + max_parallel_workers + 1 (timescale launcher) + 1 per database using timescale
max_worker_processes = 24
max_parallel_workers = 8
max_parallel_workers_per_gather = 4

# Each chunk is a table; queries/DDL touching many chunks take many locks
max_locks_per_transaction = 256

# --- Memory / planner (modest dev sizing) ---
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 128MB
random_page_cost = 1.1
effective_io_concurrency = 200

# --- WAL ---
wal_buffers = 16MB
min_wal_size = 512MB
max_wal_size = 1GB
