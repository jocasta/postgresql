# pgbouncer.ini for Docker dev testing

[databases]
; Route every database to the postgres container ("postgres" is its network alias)
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Log to stderr so it shows in `docker logs`
logfile =
pidfile =

; Client auth: passwords come from userlist.txt (generated by the start script)
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Admin console: psql -h localhost -p 6432 -U <user> pgbouncer
admin_users = mike
stats_users = mike

; --- Pooling ---
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
min_pool_size = 0
reserve_pool_size = 5
server_idle_timeout = 600

; Protocol-level prepared statements in transaction mode
max_prepared_statements = 200

; JDBC (e.g. Flyway) sends this on connect
ignore_startup_parameters = extra_float_digits

; Useful for dev visibility
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
